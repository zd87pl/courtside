[project]
name = "courtside"
version = "0.1.0"
description = "Local tennis video analysis demo on Apple Silicon (MLX) - hybrid rally segmentation + VLM coaching reports"
requires-python = ">=3.11"
dependencies = [
    "mlx-vlm>=0.5.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
server = ["openai>=1.40"]

[project.scripts]
courtside = "courtside.analyze:main"
courtside-bench = "courtside.bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["courtside"]

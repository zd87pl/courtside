[project]
name = "courtside"
version = "0.1.0"
description = "Local tennis video analysis demo on Apple Silicon (MLX) - hybrid rally segmentation + VLM coaching reports"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pydantic>=2.7",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# mlx-vlm is Apple-Silicon-only; keeping it out of the core deps means the
# model-free parts (segmentation, schema, reports) install and test anywhere.
# Bounded <0.7 for API churn; floor at 0.6.0 so mlx-vlm==0.6.3 stays
# installable - 0.6.4+ has a reported Qwen-family generation regression
# (Blaizzy/mlx-vlm#1526) and 0.6.3 is the known-good fallback.
local = ["mlx-vlm>=0.6.0,<0.7"]
server = ["openai>=1.40"]
youtube = ["yt-dlp>=2024.10.0"]
# biomechanics overlays: YOLO pose (torch; uses MPS on Apple Silicon, CPU elsewhere)
pose = ["ultralytics>=8.3"]
dev = ["pytest>=8.0"]

[project.scripts]
courtside = "courtside.analyze:main"
courtside-bench = "courtside.bench:main"
courtside-ui = "courtside.webapp:main"
courtside-doctor = "courtside.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["courtside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

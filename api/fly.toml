# Template: deploy.sh substitutes your chosen app name and region.
app = 'replace-with-your-app-name'
kill_signal = 'SIGTERM'
kill_timeout = '30s'
primary_region = 'iad'

[build]
  dockerfile = 'api/Dockerfile'

[env]
  DEFAULT_MODEL = 'qwen/qwen3.8-27b'
  HF_HOME = '/data/hf'
  JOB_TIMEOUT_S = '14400'
  LOG_LEVEL = 'INFO'
  S3_REGION = 'auto'
  WORKER_CONCURRENCY = '1'
  WORK_DIR = '/data/work'

[processes]
  api = 'uvicorn courtside_api.app:app --host 0.0.0.0 --port 8080 --workers 2'
  worker = 'python -m courtside_api.worker'

[[mounts]]
  source = 'courtside_work'
  destination = '/data'
  processes = ['worker']

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['api']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 400
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['api']

[[vm]]
  size = 'performance-2x'
  memory = '8gb'
  processes = ['worker']

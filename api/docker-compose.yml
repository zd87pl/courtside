# Local stack: Postgres + MinIO standing in for Neon/Tigris, plus the API and
# worker built from the same image Fly runs. Run from the REPO ROOT:
#
#   docker compose -f api/docker-compose.yml up --build
#
# Then: http://localhost:8080/docs  and  http://localhost:9001 (MinIO console)

name: courtside-api

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: courtside
      POSTGRES_DB: courtside
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: courtside
      MINIO_ROOT_PASSWORD: courtside123
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  createbucket:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 courtside courtside123 &&
      mc mb --ignore-existing local/courtside &&
      echo bucket ready"

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      args:
        INSTALL_POSE: ${INSTALL_POSE:-false}
    command: uvicorn courtside_api.app:app --host 0.0.0.0 --port 8080
    ports: ["127.0.0.1:8080:8080"]
    environment: &env
      REQUIRE_PROVIDER_BUDGET: ${REQUIRE_PROVIDER_BUDGET:-true}
      REQUIRE_USER_ID: "true"
      ENABLE_POSE: ${INSTALL_POSE:-false}
      DATABASE_URL: postgres://courtside:courtside@postgres:5432/courtside
      ADMIN_TOKEN: local-admin-token
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen/qwen3.8-27b}
      OPENROUTER_URL: ${OPENROUTER_URL:-https://openrouter.ai/api/v1}
      S3_BUCKET: courtside
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY_ID: courtside
      S3_SECRET_ACCESS_KEY: courtside123
      S3_FORCE_PATH_STYLE: "true"
      WORK_DIR: /data/work
      WEBHOOK_SECRET: local-webhook-secret
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
    depends_on:
      postgres: {condition: service_healthy}
      createbucket: {condition: service_completed_successfully}

  worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
      args:
        INSTALL_POSE: ${INSTALL_POSE:-false}
    command: python -m courtside_api.worker
    environment: *env
    volumes:
      - work:/data
    depends_on:
      postgres: {condition: service_healthy}
      createbucket: {condition: service_completed_successfully}
    healthcheck:
      disable: true
    stop_grace_period: 30s

volumes:
  postgres:
  minio:
  work:
